# Сайт-приглашение Иван & София — https://pepesewwedding.ru
# На сервере: /etc/nginx/sites-available/wedding (+ snippets/wedding-headers.conf, conf.d/wedding-ratelimit.conf)

# HTTP: только проверка домена Let's Encrypt, остальное — на HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://pepesewwedding.ru$request_uri;
    }
}

# www и прочие имена по HTTPS → основной домен
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pepesewwedding.ru;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/pepesewwedding.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pepesewwedding.ru/privkey.pem;

    return 301 https://pepesewwedding.ru$request_uri;
}

# Основной сайт
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name pepesewwedding.ru;

    ssl_certificate     /etc/letsencrypt/live/pepesewwedding.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pepesewwedding.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Открыли по IP или чужому имени — ведем на домен
    if ($host != "pepesewwedding.ru") {
        return 301 https://pepesewwedding.ru$request_uri;
    }

    root /var/www/wedding;
    index index.html;
    charset utf-8;
    server_tokens off;

    include snippets/wedding-headers.conf;

    # Сжатие текстовых файлов (js/scene.js ~576 КБ → ~150 КБ)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml text/calendar application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Бэкенд: прием ответов RSVP (server/bot.py на 127.0.0.1:8081)
    location /api/ {
        limit_req zone=rsvp burst=5 nodelay;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        include snippets/wedding-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Иконка — SVG; на старый запрос /favicon.ico отдаем ее же
    location = /favicon.ico {
        access_log off;
        types { }
        default_type image/svg+xml;
        try_files /assets/img/favicon.svg =204;
    }

    # HTML всегда перепроверяется — гости сразу видят обновления
    location = /index.html {
        include snippets/wedding-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Скрипты, стили, картинки: час в кэше, дальше перепроверка по ETag
    location ~* \.(?:js|css|webp|svg|png|jpg)$ {
        include snippets/wedding-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Файл календаря для iPhone / Outlook
    location = /wedding.ics {
        types { }
        default_type text/calendar;
        include snippets/wedding-headers.conf;
        add_header Content-Disposition 'attachment; filename="wedding.ics"' always;
    }
}
